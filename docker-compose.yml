version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: naturem-postgres
    environment:
      POSTGRES_DB: naturem
      POSTGRES_USER: naturem_user
      POSTGRES_PASSWORD: naturem_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naturem_user -d naturem"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: naturem-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: naturem
      DB_USER: naturem_user
      DB_PASSWORD: naturem_password
      JWT_SECRET: your-secret-key-change-this-in-production
      JWT_EXPIRES_IN: 7d
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm start

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: naturem-frontend
    environment:
      REACT_APP_API_URL: http://localhost:3001
      REACT_APP_NAME: Naturem
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data:
